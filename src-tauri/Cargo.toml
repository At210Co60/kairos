[package]
name = "kairos"
version = "0.1.0"
description = "Kairos - liquid glass desktop assistant"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "cookies", "form", "gzip", "brotli"] }
sysinfo = "0.33"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Media_Ocr",
  "Globalization",
  "Graphics_Imaging",
  "Security_Cryptography",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
] }
windows-future = "0.3"
